name: Print Env Variables
on:
  workflow_dispatch

env:
  DBHOST: ${{ vars.MYSQL_HOST }}
  DBPORT: ${{ vars.MYSQL_PORT }}
  DBUSER: ${{ vars.MYSQL_USER }}

jobs:
  github-default-env-variables:
    runs-on: [ self-hosted ]
    outputs:
      user: ${{ steps.setuser.outputs.USER }}
    steps:
      - name: Print - GitHub Default Env Variables
        run: |
          echo " GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"      
          echo "       GITHUB_REF: $GITHUB_REF"
          echo "  GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "       GITHUB_SHA: $GITHUB_SHA"
          echo "    GITHUB_RUN_ID: $GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "     GITHUB_ACTOR: $GITHUB_ACTOR"
          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
          echo "       GITHUB_ENV: $GITHUB_ENV"
          echo "      RUNNER_NAME: $RUNNER_NAME"
          echo "        RUNNER_OS: $RUNNER_OS"
          echo "      RUNNER_ARCH: $RUNNER_ARCH"
          echo "      RUNNER_TEMP: $RUNNER_TEMP"
          echo "               CI: $CI"
          echo ""
          echo "___________________________________"
          echo ""
          echo " github.workspace: ${{ github.workspace }}"
          echo "github.repository: ${{ github.repository }}"      
          echo "       github.ref: ${{ github.ref}}"
          echo "  github.ref_name: ${{ github.ref_name}}"
          echo "       github.sha: ${{ github.sha}}"
          echo "    github.run_id: ${{ github.run_id}}"
          echo "github.run_number: ${{ github.run_number}}"
          echo "     github.actor: ${{ github.actor}}"
          echo "github.event_name: ${{ github.event_name}}"
          echo "       github.env: ${{ github.env}}"
          echo "      runner.name: ${{ runner.name}}"
          echo "        runner.os: ${{ runner.os}}"
          echo "      runner.arch: ${{ runner.arch}}"
          echo "      runner.temp: ${{ runner.temp}}"

      - name: Print - variables from repo/org settings.
        run: |
          echo "DBHOST: $DBHOST"
          echo "DBPORT: $DBPORT"
          echo "DBUSER: $DBUSER"

      # GITHUB_ENV 
      - name: Print - ADD - variables to GITHUB_ENV file
        run: |
          VERSION="1.2.5"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION: $APP_VERSION"
      - name: Print - GET - variables from GITHUB_ENV file
        run: |
          echo "APP_VERSION: $APP_VERSION"
      
      - name: Print - ADD - variables export
        run: |
          export DB_VERSION="1.2.5"
          echo $DB_VERSION
      - name: Print - GET - variables from exported env
        run: |
          echo "DB_VERSION: $DB_VERSION"

      # GITHUB_OUTPUT
      # Save key=value data to GITHUB_OUTPUT 
      - name: Set GITHUB_OUTPUT
        id: setuser
        run: |
          echo "GITHUB_OUTPUT: $GITHUB_OUTPUT"
          echo "USER=santarvedi" >> $GITHUB_OUTPUT

      # Get key=value data from GITHUB_OUTPUT - Same Job
      - name: Get GITHUB_OUTPUT
        run: |
          echo "USER: ${{ steps.setuser.outputs.USER }}"  

  job2:
    runs-on: [ self-hosted ]
    needs: github-default-env-variables
    steps:
      # Print key=value from GITHUB_OUTPUT - Another Job
      - name: print output from Another job
        run: |
          echo "USER: ${{ needs.github-default-env-variables.outputs.user }}"

  job3:
    runs-on: [ self-hosted ]
    steps:
      - name: Print env - workflow
        run: env
      - name: Print env - runner
        run: |
          env
     




# >|GITHUB_WORKSPACE|Repository working directory on the runner|
# >|GITHUB_REPOSITORY|Repository name, such as owner/repo|
# >|GITHUB_REF|Branch or tag reference|
# >|GITHUB_REF_NAME|Short branch or tag name|
# >|GITHUB_SHA|Commit SHA that triggered the workflow|
# >|GITHUB_RUN_ID|Unique workflow run ID|
# >|GITHUB_RUN_NUMBER|Run number within the repository|
# >|GITHUB_ACTOR|User or actor who initiated the run|
# >|GITHUB_EVENT_NAME|Trigger event, such as push|
# >|GITHUB_ENV|File used to export variables to subsequent steps|
# >|RUNNER_NAME|Name of the runner|
# >|RUNNER_OS|Runner OS: Linux, Windows, or macOS|
# >|RUNNER_ARCH|Runner architecture, such as X64 or ARM64|
# >|RUNNER_TEMP|Temporary directory on the runner|
# >|CI|Usually true in GitHub Actions|